services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: transistemas-bot:local
    container_name: transistemas-bot
    restart: unless-stopped
    env_file:
      - .env
    init: true
    mem_limit: 300m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('discord.js').GatewayIntentBits.Guilds\" || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
